title = "Shared package declarations"
profiles = { personal = 0b100, laboratory = 0b010, laptop = 0b001 }

# Bits: personal | laboratory | laptop.
# Missing on inherits; explicit on replaces the inherited mask.
# Excluded parents still allow selected descendants.
# Package suffixes override the mask: "base:111"; ":000" selects no device.
# Groups inherit their node mask and remain symbolic until pacman expansion.
# Dependencies use exact paths within the source file and never enable nodes.
# Directory mounts inherit the node mask; relative paths use the source folder.
# Missing manifests fail unless optional=true. Private files stay external.
# Repeated package declarations are merged with all selected sources retained.

on = 0b111

########################################
# System: machine baseline and core services that make the OS boot and function.
########################################
[system]
on = 0b110

[system.base]
packages=[
    "base:111", # Also needed in WSL
    "linux",
    "linux-headers",
    "linux-firmware-nvidia",
    "linux-firmware-mediatek",
    "linux-firmware-realtek",
    "linux-firmware-other"
]

[system.boot]
packages=[
    "grub",               # bootloader
    "grub-customizer",
    "efibootmgr"         # =grub= write boot entries to NVRAM
]

[system.network]
packages=[
    "networkmanager",
    "iptables",
    "sshguard",
    "clash-verge-rev-bin",
]

[system.portal]
on = 0b111
packages=[
    "gnome-keyring",
    "xdg-user-dirs",  # no abused dir at home
    "accountsservice" # user avatar
]

[system.sound]
packages=[
    "pipewire",
    "pipewire-alsa",
    "pipewire-jack",
    "pipewire-pulse",
    "wireplumber"
]

[system.bluetooth]
packages=["blueman", "bluez", "bluez-utils"]

[system.inputmethod]
groups=["fcitx5-im"]
packages=[
    "fcitx5-nord",
    "fcitx5-rime",
    "rime-cloverpinyin",
    "rime-pinyin-zhwiki"
]

[system.windows]
on = 0b100
packages=[
    "ntfs-3g",     # mount ntfs partition
    "os-prober",   # other os entries in grub
    "chntpw",      # dual boot bluetooth repair
    "bt-synckeys", # bluetooth key sync
]

[system.monitor]
on = 0b000
packages=[
    "cpupower-gui",
    "dmidecode",
    "hdparm",
    "smartmontools",
    "turbostat",
    "hwinfo"
]

########################################
# Desktop: graphical session, theming, fonts, terminal, and capture tools.
########################################
[desktop]
on = 0b110

[desktop.dms]
packages = [
    "dms-shell",
    "python-pywal",
    "python-pywalfox-librewolf", # sync walfox theme
    "matugen"
]

[desktop.niri]
on = 0b000
packages = [
    "niri",
    "dms-shell-niri",
    "xdg-desktop-portal-gtk",
    # "xdg-desktop-portal-gnome", # for screencast
    "gnome-keyring",
    "lxqt-policykit",
    "xwayland-satellite"
]

[desktop.hyprland]
directory="~/.config/hypr/"
optional=true # This checkout may have no package manifest
packages = [
    "hyprland",
    "dms-shell-hyprland",
    "adw-gtk-theme", # dms GTK colors
    "qt6ct-kde" # dms QT colors; conflicts with qt6ct (see desktop.theme.qt)
]

[desktop.xorg]
on = 0b000
packages=[
    "xorg-server",
    "xorg-xdpyinfo",   # for =betterlockscreen=
    "xorg-xwininfo",   # Option for ~picom-trans~
    "dragon-drop",
    "mons"
]

[desktop.awesome]
on = 0b000
directory="~/.config/awesome/"
depends_on=["desktop.xorg"]
packages=[
    "awesome-git"
]

[desktop.display-manager.sddm]
on = 0b000
depends_on=["desktop.xorg"]
packages=[
    "sddm",
    "sddm-theme-corners-git",
    "sddm-sugar-light",
    # "sddm-sugar-candy-git"
]

[desktop.display-manager.lightdm]
on = 0b000
depends_on=["desktop.xorg"]
packages=[
    "lightdm",
    "lightdm-webkit-theme-aether",
    "lightdm-webkit-theme-litarvan"
]

[desktop.display-manager.greetd]
packages=[
    "greetd-dms-greeter-git"
]

[desktop.theme]
on = 0b111

[desktop.theme.gtk]
packages=[
    "orchis-theme-dracula-git",
    "gtk-engine-murrine",
    "gtk2"
]

[desktop.theme.qt]
packages=[
    "qt5-wayland",
    "qt5ct",
    # "qt6ct", # for some qt6 applications; conflicts with qt6ct-kde (see desktop.hyprland)
]

[desktop.theme.shared]
packages=[
    "papirus-icon-theme",
    "bibata-cursor-theme-bin",
]

[desktop.fonts]
on = 0b111
packages=[
    "ttf-sarasa-gothic-sc", # default UI font
    "noto-fonts-emoji"  # emoji support
]

[desktop.fonts.extra]
on = 0b000
# those are all my favorite fonts
packages=[
    "font-manager",
    # "fontforge", # build custom fonts
    # sans
    "ttc-iosevka-aile",
    "ttf-fira-sans",
    "ttf-opensans",
    # serif
    "adobe-source-serif-fonts",
    "gentium-plus-font",
    # code
    "ttf-agave-nerd",
    "ttf-bqn386-git",
    "ttf-firacode-nerd",        # ligature
    "ttf-maple",
    "ttf-recursive",
    # ui
    "ttf-comic-shanns-v2",
    # emoji
    "ttf-material-design-icons-git",
    "quirvira",
    # chinese
    "ttf-arphic-ukai",
    "ttf-kose-git",
    "ttf-lxgw-wenkai",
    "ttf-yozai-font", # cute hand-write
    "ttf-lxgw-neo-xihei",
    "wqy-microhei"
]

[desktop.terminal]
packages=["alacritty"]

[desktop.capture]
packages=[
    "flameshot",
    "grim",
    "peek", # screen recorder
]

########################################
# Hardware: drivers and device-specific packages tied to physical hardware.
########################################
[hardware]
on = 0b110

[hardware.nvidia]
packages=[
    "nvidia-open-dkms",
    # "nvidia-580xx-dkms", # for old hardware
    "libva-nvidia-driver", # hardware video acceleration
    "nvtop"
]

[hardware.amd]
packages=[
    "amd-ucode",
]

[hardware.amd.gpu]
# for cpu with integrated graphics
on = 0b000
packages=[
    "amdgpu_top-bin",
    "mesa",             # 3D hardware video acceleration
    "lib32-mesa",
    "libva-utils",      # vainfo
    "mesa-utils",       # glxinfo
    "xf86-video-amdgpu" # xorg
]

[hardware.usb]
packages=[
    "udiskie",    # automount usb drive
    "usbutils",   # =lsusb=
    "ventoy-bin", # usb bootable media
]

[hardware.personal-devices]
on = 0b100
packages=[
    "openrgb-bin",
    "i2c-tools", # for =openrgb=
    "via-appimage"
]

[hardware.printer]
on = 0b010
packages=["cups", "hplip"]

########################################
# Development: toolchains, shells, editors, AI helpers, and local build/runtime tooling.
########################################
[dev]

[dev.base]
packages=[
    "base-devel", # =gcc, which, make, gdb, sudo=
    "python",
    "python-tomli", # required by this script
    "git",
    "openssh",
    "paru"
]

[dev.shell]
packages=[
    "fish",
    "wget",
    "bc",
    "jq",
    "tmux",
    "xcape",         # CapsLK as Esc in wsl
    "starship",      # shell prompt pretty
    "python-pipenv",
    "python-pipx",
    "direnv",
    "zoxide",
    "fish-done",     # notify background shell work done
    "xorg-xdpyinfo"
]

[dev.editors]
directory="~/.config/doom/"
packages=["emacs-wayland", "fd", "ripgrep"]

[dev.ai]
packages=[
    "cc-switch-bin",
    "claude-code",
    "openai-codex",
    "opencode"
]

[dev.vcs]
on = 0b110
packages=[
    "rsync",
    "git-filter-repo",
    "git-lfs",
]

[dev.containers]
on = 0b110
packages=[
    "docker",
    "docker-compose",
]

[dev.virtualization]
on = 0b000
packages=[
    "dnsmasq",
    "edk2-ovmf",
    "genymotion", # android x86
    "libvirt",
    "qemu-desktop",
    "swtpm",
    "virt-manager",
    "virtio-win"
]

########################################
# Research: domain-specific scientific and notebook environments.
########################################
[research]
on = 0b110

[research.base]
packages=[
    "jupyter-notebook",
    "mathematica:110",
    "miktex:110",
    "zotero-bin"
]

########################################
# Applications: end-user apps you run directly rather than infrastructure.
########################################
[apps]
on = 0b110

[apps.browser]
packages=["librewolf-bin"]

[apps.sync]
packages=["syncthing", "nextcloud-client"]

[apps.amuse]
on = 0b100
packages=[
    "mpv",
    "qimgv", # image viewer
]

[apps.gaming]
on = 0b100
packages=[
    "steam",
    "mangohud",     # resource monitor in game
    "goverlay",     # change appearance of mangohud
    "uudeck-bwrap", # multiplayer game delay reducing
]

[apps.communication]
on = 0b100
packages=[
    "wechat-universal-bwrap",
    # "wemeet-bin",
    "telegram-desktop",
    "linuxqq-nt-bwrap",
]

########################################
# Tools: general-purpose utilities for package management, remote access, and diagnostics.
########################################
[tools]

[tools.cli]
packages=[
    "bat",            # better =cat=
    "btop",           # system monitor
    "eza",            # better =ls=
    "fzf",            # extend `zoxide' with selection
    "gdu-bin",        # =du= on all directories
    "man-db",         # man page
    "fastfetch",      # btw, ..
    "openbsd-netcat", # ssh using http tunnel using =nc=
    "zip",
    "7zip",
    "proxychains-ng", # force proxy
    # "tmsu-bin",       # tag manager system
    "trash-cli",
    "unrar",
    "unzip",
    "yadm"            # reason you are here
]

[tools.packaging]
packages=[
    "expac",                  # query installed packages
    "pacfinder",
    "pacman-contrib",         # =checkupdates, paccache=
    "rebuild-detector",       # detect packages need to rebuild
]

[tools.remote]
on = 0b110
packages=[
    "deskflow", # share keyboard
    "reframe",
    "remmina"
    # "tigervnc-server",
    # "realvnc-vnc-viewer"
]

[tools.benchmark]
on = 0b000
packages=[
    "blender-benchmark",
    "unigine-heaven",
    "cpu-x",
    "crazydiskinfo",
    "kdiskmark",
    "nvme-cli",
    "s-tui"
]

########################################
# Local: machine-private package extensions outside yadm tracking.
########################################
[local]

[local.private]
directory="~/.config/paru/"
optional=true # Local private declarations may be absent

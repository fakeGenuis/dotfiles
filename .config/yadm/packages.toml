title="declarative packages configuration"
# nix is somewhat too complicate for me

# default select for module/directory
enable_default=true

[flags]
is_wsl="which powershell.exe &>/dev/null"
is_laptop="ls /sys/class/power_supply | grep BAT &>/dev/null"
is_personal="[ \"$(yadm config local.class)\" = \"personal\" ]"

# ============ SYSTEM ============
[system.essential]
enabled="not is_wsl"
packages=[
    "base",
    "linux",
    "linux-headers",
    "linux-firmware",
    "networkmanager"
]

[system.boot]
enabled="not is_wsl"
packages=[
    "grub",               # bootloader
    "grub-customizer",
    "efibootmgr"         # =grub= write boot entries to NVRAM
]

[system.user]
enabled="not is_wsl"
packages=[
    "gnome-keyring",
    "xdg-user-dirs",  # no abused dir at home
    "accountsservice" # user avatar
]

[system.wsl-extra]
enabled="is_wsl"
packages=[
    "base"
]

[system.network]
enabled="not is_wsl"
packages=[
    "iptables-nft",
    "sshguard"
]

# ============ HARDWARE ============
[hardware.nvidia]
enabled="not is_wsl"
packages=[
    "nvidia-open-dkms",
    "nvidia-utils",
    "nvidia-settings",
    "libva-nvidia-driver", # hardware video acceleration
    "nvidia-prime",
    "nvtop"
]

[hardware.amd]
enabled=false
# for cpu with integrated graphics
packages=[
    "amd-ucode",
    "mesa",             # 3D hardware video acceleration
    "lib32-mesa",
    "mesa-utils",       # glxinfo
    "xf86-video-amdgpu" # xorg
]

[hardware.usb]
enabled="not is_wsl"
packages=[
    "udiskie",             # automount usb drive
    "usbutils",            # =lsusb=
    "ventoy-bin",          # usb bootable media
    "dosfstools",          # mkfs.fat
    "exfatprogs",          # mkfs.exfat
    "nvme-cli"             # NVMe drive management
]

[hardware.devices]
enabled="is_personal and not is_wsl"
packages=[
    "openrgb-bin",
    "i2c-tools"  # for =openrgb=
]

# ============ DISPLAY ============
[display.display-server]
enabled=false
# only enable when there is display manager
packages=[
    "xorg-server",
    "xorg-xdpyinfo",   # for =betterlockscreen=
    "xorg-xwininfo",   # Option for ~picom-trans~
    "dragon-drop",
    "mons"
]

[display.sddm]
enabled=false
depends_on=["display.display-server"]
packages=[
    "sddm",
    "sddm-theme-corners-git"
]

[display.lightdm]
enabled=false
depends_on=["display.display-server"]
packages=[
    "lightdm",
    "lightdm-webkit-theme-aether",
    "lightdm-webkit-theme-litarvan"
]

[display.gtk]
packages=[
    "gtk2",                # pinenty
    "gtk4",
    "bibata-cursor-theme-bin",
    "papirus-icon-theme",
    "ttf-sarasa_ui-sc",    # default font for gtk
    "adw-gtk-theme",       # libadwaita theme for gtk3
    "webkit2gtk",
    "orchis-theme-dracula-git",
    "gtk-engine-murrine"   # gtk2 support with orchis-theme-git
]

[display.qt5ct]
enabled="not is_wsl"
packages=[
    "kvantum",
    "kvantum-qt5",         # qt5 style theme
    "kvantum-theme-orchis-git",
    "papirus-icon-theme",
    "qt5-styleplugins",
    "qt5ct",
    "qt6ct"                # for some qt6 applications
]

[display.fontconfig]
packages=[
    "ttf-sarasa-gothic-sc",
    "ttf-sarasa_ui-sc",
    "noto-fonts-emoji"     # emoji support
]

# ============ DESKTOP ============
[desktop.awesome]
enabled="not is_wsl"
directory="~/.config/awesome/"
packages=[
    "awesome-git"
]

[desktop.sound]
enabled="not is_wsl"
packages=[
    "pipewire",
    "pipewire-alsa",
    "pipewire-jack",
    "pipewire-pulse",
    "playerctl",
    "wireplumber"
]

[desktop.bluetooth]
enabled="not is_wsl"
packages=["blueman", "bluez", "bluez-utils"]

[desktop.input-method]
enabled="not is_wsl"
groups=["fcitx5-im"]
packages=[
    "fcitx5-nord",
    "fcitx5-rime",
    "rime-cloverpinyin",
    "rime-pinyin-zhwiki"
]

[desktop.wayland]
enabled="not is_wsl"
packages=[
    "wl-clipboard",
    "grim",                # screenshot
    "cliphist",            # clipboard history
    "xwayland-satellite",  # X apps on pure wayland without XWayland display server
    "qt5-wayland",
    "nwg-look",            # GTK settings GUI for wayland
    "matugen"              # material color generation from wallpaper
]

[desktop.greetd]
enabled="not is_wsl"
packages=[
    "greetd-dms-greeter-git"
]

# ============ DEVELOPMENT ============
[development.base-dev]
packages=[
    "base-devel",          # =gcc, which, make, sudo=
    "gdb",
    "python-tomli",        # required by this script
    "python",
    "git",
    "openssh",
    "paru",
    "clang",
    "direnv",
    "git-lfs",
    "git-filter-repo"
]

[development.shell-utilities]
packages=[
    "bat",            # better =cat=
    "btop",           # system monitor
    "eza",            # better =ls=
    "zoxide",         # better =cd=
    "fzf",            # extend `zoxide' with selection
    "gdu-bin",        # =du= on all directories
    "man-db",         # man page
    "fastfetch",
    "openbsd-netcat", # ssh using http tunnel using =nc=
    "7zip",
    "proxychains-ng", # force proxy
    "tmsu-bin",       # tag manager system
    "tokei",          # count lines of code
    "trash-cli",
    "unrar",
    "unzip",
    "yadm",           # reason you are here
    "jq",             # JSON processor
    "yq",             # YAML processor
    "wget",
    "rsync",
    "lsof",
    "tmux",
    "dos2unix",
    "mtr",            # network diagnostic
    "wdiff",          # word diff
    "ssl-cert-check", # SSL cert expiry check
    "figlet"          # ASCII banner text
]

[development.python-dev]
packages=[
    "python-black",
    "python-isort",
    "python-pylint",
    "python-lsp-server",
    "python-pip",
    "python-pipx",
    "python-pytest"
]

[development.python-science]
enabled="not is_wsl and not is_laptop"
packages=[
    "python-matplotlib",
    "python-pandas",
    "python-seaborn",
    "python-sympy",
    "python-tqdm",
    "python-requests",
    "python-xarray",
    "gnuplot"
]

[development.more-dev]
enabled="not is_wsl"
packages=[
    "blender",
    "docker",
    "docker-compose",
    "obs-studio",
    "ollama-cuda",         # LLMs
    "gimp",
    "jdk-openjdk",
    "vscodium-bin-marketplace",
    "gparted"
]

[development.doom]
directory="~/.config/doom/"
packages=[
    "emacs-wayland",
    "fd",
    "ripgrep"
]

[development.fish]
packages=[
    "bc",
    "fish",
    "xcape",         # CapsLK as Esc in wsl
    "starship",      # shell prompt pretty
    "xorg-xdpyinfo", # set =GDK_SCALE= depends on resolution
    "fish-done"      # notify background shell work done
]

# ============ APPLICATIONS ============
[applications.other-applications]
enabled="not is_wsl"
packages=[
    "alacritty",
    "dracula-alacritty-git",
    "librewolf-bin",
    "zen-browser-bin",
    "python-pywalfox-librewolf", # sync walfox theme
    "peek"                       # screen recorder
]

[applications.amuse]
enabled="is_personal and not is_wsl"
packages=[
    "mpv",
    "qimgv",                  # image viewer
    "steam-native-runtime"
]

[applications.communicate]
enabled="is_personal and not is_wsl"
packages=[
    "wechat-universal-bwrap",
    "telegram-desktop"
]

[applications.ai-tools]
packages=[
    "claude-code",
    "gemini-cli",
    "openai-codex"
]

# ============ SERVICES ============
[services.system-services]
enabled="not is_wsl"
packages=[
    "acpid",         # ACPI event daemon
    "rtkit",         # realtime privilege for pipewire
    "cpupower",      # CPU frequency scaling
    "syncthing",     # file sync
    "smartmontools", # disk health
    "turbostat"      # CPU stats
]

# ============ TOOLS ============
[tools.passwords]
packages=[
    "pass",
    "pwgen"
]

[tools.keyd]
enabled="not is_wsl"
packages=[
    "keyd",
    "via-appimage"  # keyboard configurator GUI
]

[tools.pdf-tools]
packages=[
    "ocrmypdf",
    "pdftk",
    "poppler-glib"
]

[tools.remote]
enabled="not is_wsl"
packages=[
    "deskflow",        # share keyboard/mouse
    "remmina",
    "scrcpy",
    "tigervnc-server",
    "x11vnc",
    "wayvnc",
    "realvnc-vnc-viewer",
    "autossh"
]

[tools.printing]
enabled="not is_wsl"
packages=[
    "cups",
    "hplip"
]

# ============ RESEARCH ============
[research.research]
enabled="not is_wsl and not is_laptop"
packages=[
    "jupyter-notebook",
    "mathematica",
    "zotero-bin"
]

# ============ CONFIGURATION ============
[config.pacman]
packages=[
    "expac",                  # query installed packages
    "pacman-contrib",         # =checkupdates, paccache=
    "rebuild-detector"        # detect packages need to rebuild
]

[config.paru-private]
directory="~/.config/paru"

[config.proxy]
enabled="not is_wsl"
packages=[
    "xray-bin",
    "qv2ray",
    "clash-verge-rev-bin",
    "v2ray-domain-list-community",
    "v2ray-geoip"
]

# ============ ADVANCED / OPTIONAL ============
[advanced.windows]
enabled="is_personal and not is_wsl"
packages=[
    "ntfs-3g",   # mount ntfs partition
    "os-prober", # other os entries in grub
    "chntpw"     # dual boot bluetooth repair
]

[advanced.virtual]
enabled=false
# enabled="is_personal and not is_laptop and not is_wsl"
packages=[
    "dnsmasq",
    "edk2-ovmf",
    "genymotion", # android x86
    "libvirt",
    "qemu-desktop",
    "swtpm",
    "virt-manager",
    "virtio-win"
]

[advanced.monitor]
enabled=false
packages=[
    "cpupower-gui",
    "hdparm",
    "smartmontools",
    "turbostat",
    "hwinfo"
]

[advanced.benchmark]
enabled=false
packages=[
    "blender-benchmark",
    "unigine-heaven",
    "cpu-x",
    "crazydiskinfo",
    "kdiskmark",
    "nvme-cli",
    "s-tui"
]

[advanced.font-manager]
enabled=false
# those are all my favorite fonts
packages=[
    "font-manager",
    # sans
    "ttc-iosevka-aile",
    "ttf-fira-sans",
    "ttf-opensans",
    "ttf-sarasa-gothic-sc",
    # serif
    "adobe-source-serif-fonts",
    "gentium-plus-font",
    # code
    "ttf-agave-nerd",
    "ttf-bqn386-git",
    "ttf-firacode-nerd",        # ligature
    "ttf-maple",
    "ttf-recursive",
    # ui
    "ttf-comic-shanns-v2",
    # emoji
    "ttf-material-design-icons-git",
    "noto-fonts-emoji",
    "quirvira",
    # chinese
    "ttf-arphic-ukai",
    "ttf-kose-git",
    "ttf-lxgw-wenkai",
    "ttf-yozai-font", # cute hand-write
    "ttf-lxgw-neo-xihei",
    "wqy-microhei"
]

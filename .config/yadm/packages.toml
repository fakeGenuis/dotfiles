title="declarative packages configuration"
# nix is somewhat too complicate for me

# active_profile can be overridden by future CLI support.
# profile names are expanded through depends_on/exclude with prefix matching.
active_profile="laboratory"

########################################
# Profiles: choose one machine preset, then expand its module selections.
########################################
[profiles.personal]
depends_on=["all"]
exclude=[
    "hardware.printer",
]

[profiles.laboratory]
depends_on=["all"]
exclude=[
    "system.windows",
    "hardware.personal-devices",
    "apps.amuse",
    "apps.communication",
]

[profiles.laptop]
depends_on=[
    "system.portal",
    "desktop.theme",
    "desktop.fonts",
    "dev.shell",
    "dev.editors",
    "dev.ai",
    "tools.cli",
    "tools.packaging",
    "local",
]
exclude=[]

########################################
# System: machine baseline and core services that make the OS boot and function.
########################################
[system.base]
packages=[
    "base",
    "linux",
    "linux-headers",
    "linux-firmware-nvidia",
    "linux-firmware-realtek",
    "linux-firmware-other"
]

[system.boot]
packages=[
    "grub",               # bootloader
    "grub-customizer",
    "grub-theme-stylish-color-2k-git",
    "efibootmgr"         # =grub= write boot entries to NVRAM
]

[system.network]
packages=[
    "networkmanager",
    "iptables-nft",
    "sshguard",
    "clash-verge-rev-bin",
]

[system.portal]
packages=[
    "gnome-keyring",
    "xdg-user-dirs",  # no abused dir at home
    "accountsservice" # user avatar
]

[system.sound]
packages=[
    "pipewire",
    "pipewire-alsa",
    "pipewire-jack",
    "pipewire-pulse",
    "wireplumber"
]

[system.bluetooth]
packages=["blueman", "bluez", "bluez-utils"]

[system.inputmethod]
groups=["fcitx5-im"]
packages=[
    "fcitx5-nord",
    "fcitx5-rime",
    "rime-cloverpinyin",
    "rime-pinyin-zhwiki"
]

[system.windows]
packages=[
    "ntfs-3g",   # mount ntfs partition
    "os-prober", # other os entries in grub
    "chntpw"     # dual boot bluetooth repair
]

[system.monitor]
enabled=false
packages=[
    "cpupower-gui",
    "dmidecode",
    "hdparm",
    "smartmontools",
    "turbostat",
    "hwinfo"
]

########################################
# Desktop: graphical session, theming, fonts, terminal, and capture tools.
########################################
[desktop.wayland]
packages = [
    "cliphist",
    "dms-shell-bin",
    "niri",
    "grim",
    "keyd",
    "xwayland-satellite"
]

[desktop.xorg]
enabled=false
packages=[
    "xorg-server",
    "xorg-xdpyinfo",   # for =betterlockscreen=
    "xorg-xwininfo",   # Option for ~picom-trans~
    "dragon-drop",
    "mons"
]

[desktop.display-manager.sddm]
enabled=false
depends_on=["desktop.xorg"]
packages=[
    "sddm",
    "sddm-theme-corners-git",
    "sddm-sugar-light",
    # "sddm-sugar-candy-git"
]

[desktop.display-manager.lightdm]
enabled=false
depends_on=["desktop.xorg"]
packages=[
    "lightdm",
    "lightdm-webkit-theme-aether",
    "lightdm-webkit-theme-litarvan"
]

[desktop.display-manager.greetd]
packages=[
    "greetd-dms-greeter-git"
]

[desktop.theme.gtk]
packages=[
    "adw-gtk-theme",
    "python-pywal",
    "python-pywalfox-librewolf", # sync walfox theme
    "bibata-cursor-theme-bin",
]

[desktop.theme.qt]
packages=[
    "kvantum",
    "kvantum-qt5", # qt5 style theme
    "kvantum-theme-orchis-git",
    "qt5-wayland",
    "qt5ct",
    "qt6ct", # for some qt6 applications
]

[desktop.theme.shared]
packages=[
    "matugen",
    "nwg-look",
    "papirus-icon-theme",
]

[desktop.fonts]
packages=[
    "ttf-sarasa_ui-sc",         # default UI font
    "adobe-source-code-pro-fonts",
    "noto-fonts-emoji" # emoji support
]

[desktop.fonts.extra]
enabled=false
# those are all my favorite fonts
packages=[
    "font-manager",
    # "fontforge", # build custom fonts
    # sans
    "ttc-iosevka-aile",
    "ttf-fira-sans",
    "ttf-opensans",
    # serif
    "adobe-source-serif-fonts",
    "gentium-plus-font",
    # code
    "ttf-agave-nerd",
    "ttf-bqn386-git",
    "ttf-firacode-nerd",        # ligature
    "ttf-maple",
    "ttf-recursive",
    # ui
    "ttf-comic-shanns-v2",
    # emoji
    "ttf-material-design-icons-git",
    "quirvira",
    # chinese
    "ttf-arphic-ukai",
    "ttf-kose-git",
    "ttf-lxgw-wenkai",
    "ttf-yozai-font", # cute hand-write
    "ttf-lxgw-neo-xihei",
    "wqy-microhei"
]

[desktop.terminal]
packages=["alacritty"]

[desktop.capture]
packages=[
    "flameshot",
    "peek", # screen recorder
]

########################################
# Hardware: drivers and device-specific packages tied to physical hardware.
########################################
[hardware.nvidia]
packages=[
    # "nvidia-open-dkms",
    "nvidia-580xx-dkms", # for old hardware
    # "nvidia-utils",
    # "nvidia-settings",
    "libva-nvidia-driver", # hardware video acceleration
    "nvtop"
]

[hardware.amd]
# for cpu with integrated graphics
enabled=false
packages=[
    "amd-ucode",
    # "amdgpu_top-bin",
    "mesa",             # 3D hardware video acceleration
    "lib32-mesa",
    # "libva-utils",      # vainfo
    "mesa-utils",       # glxinfo
    "xf86-video-amdgpu" # xorg
]

[hardware.usb]
packages=[
    "udiskie",             # automount usb drive
    "usbutils",            # =lsusb=
    "ventoy-bin",          # usb bootable media
]

[hardware.personal-devices]
packages=[
    "openrgb-bin",
    "i2c-tools", # for =openrgb=
    "via-appimage"
]

[hardware.printer]
packages=["cups", "hplip"]

########################################
# Development: toolchains, shells, editors, AI helpers, and local build/runtime tooling.
########################################
[dev.base]
packages=[
    "base-devel", # =gcc, which, make, sudo=
    "gcc",
    "gcc-fortran",
    "gdb",
    "python",
    "python-tomli", # required by this script
    "git",
    "openssh",
    "paru"
]

[dev.shell]
packages=[
    "fish",
    "wget",
    "bc",
    "jq",
    "tmux",
    "xcape",         # CapsLK as Esc in wsl
    "starship",      # shell prompt pretty
    "python-pipenv",
    "python-pipx",
    "direnv",
    "zoxide",
    "fish-done",     # notify background shell work done
    "xorg-xdpyinfo"
]

[dev.editors]
directory="~/.config/doom/"
packages=["emacs-pgtk-igc-git", "fd", "ripgrep"]

[dev.ai]
packages=[
    "claude-code",
    "gemini-cli",
    "openai-codex"
]

[dev.extra]
packages=[
    # "blender",
    "rsync",
    "git-filter-repo",
    "git-lfs",
    "docker",
    "docker-compose",
    # "genymotion", # android simulator
    # "obs-studio",
    # "ollama-cuda", # LLMs
    "gimp",
    "jdk-openjdk"
]

[dev.virtualization]
enabled=false
# enabled="is_personal and not is_laptop and not is_wsl"
packages=[
    "dnsmasq",
    "edk2-ovmf",
    "genymotion", # android x86
    "libvirt",
    "qemu-desktop",
    "swtpm",
    "virt-manager",
    "virtio-win"
]

########################################
# Research: domain-specific scientific and notebook environments.
########################################
[research.base]
packages=[
    "jupyter-notebook",
    "mathematica",
    "miktex",
    "zotero-bin"
]

########################################
# Applications: end-user apps you run directly rather than infrastructure.
########################################
[apps.browser]
packages=["librewolf-bin"]

[apps.sync]
packages=["syncthing", "nextcloud-client"]

[apps.amuse]
packages=[
    "mpv",
    "qimgv", # image viewer
    "steam",
]

[apps.communication]
packages=[
    "wechat-universal-bwrap",
    # "wemeet-bin",
    "telegram-desktop"
]

########################################
# Tools: general-purpose utilities for package management, remote access, and diagnostics.
########################################
[tools.cli]
packages=[
    "bat",            # better =cat=
    "btop",           # system monitor
    "eza",            # better =ls=
    "fzf",            # extend `zoxide' with selection
    "gdu-bin",        # =du= on all directories
    "man-db",         # man page
    "fastfetch",      # btw, ..
    "openbsd-netcat", # ssh using http tunnel using =nc=
    "zip",
    "7zip",
    "proxychains-ng", # force proxy
    # "tmsu-bin",       # tag manager system
    "trash-cli",
    "unrar",
    "unzip",
    "yadm"            # reason you are here
]

[tools.packaging]
packages=[
    "expac",                  # query installed packages
    "pacfinder",
    "pacman-contrib",         # =checkupdates, paccache=
    "rebuild-detector",       # detect packages need to rebuild
]

[tools.remote]
packages=[
    "deskflow", # share keyboard
    "reframe",
    "remmina"
]

[tools.benchmark]
enabled=false
packages=[
    "blender-benchmark",
    "unigine-heaven",
    "cpu-x",
    "crazydiskinfo",
    "kdiskmark",
    "nvme-cli",
    "s-tui"
]

########################################
# Local: machine-private package extensions outside yadm tracking.
########################################
[local.private]
directory="~/.config/paru/"

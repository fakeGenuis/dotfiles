title="declarative packages configuration"
# nix is somewhat too complicate for me

# default select for module/directory
enable_default=true

[flags]
is_wsl="which powershell.exe &>/dev/null"
is_laptop="ls /sys/class/power_supply | grep BAT &>/dev/null"
is_personal="[ \"$(yadm config local.class)\" = \"personal\" ]"

# packages in the archwiki "Installation guide"
[system.base]
enabled="not is_wsl"
packages=[
    "base",
    "linux",
    "linux-headers",
    "linux-firmware-nvidia",
    "linux-firmware-realtek",
    "linux-firmware-other"
]

[system.boot]
enabled="not is_wsl"
packages=[
    "grub",               # bootloader
    "grub-customizer",
    "grub-theme-stylish-color-2k-git",
    "efibootmgr"         # =grub= write boot entries to NVRAM
]

[system.network]
packages=[
    "networkmanager",
    "iptables-nft",
    "sshguard",
    "clash-verge-rev-bin",
]

[display.wayland]
packages = [
"cliphist",
"dms-shell-bin",
"grim",
"keyd",
"matugen", "nwg-look",
"xwayland-satellite"
]

[development.llm]
packages=[
"claude-code", "gemini-cli", "openai-codex"
]

[desktop.user]
packages=[
    "gnome-keyring",
    "xdg-user-dirs",  # no abused dir at home
    "accountsservice" # user avatar
]

[hardware.nvidia]
enabled="not is_wsl"
packages=[
    # "nvidia-open-dkms",
    "nvidia-580xx-dkms", # for old hardware
    # "nvidia-utils",
    # "nvidia-settings",
    "libva-nvidia-driver", # hardware video acceleration
    "nvtop"
]

[hardware.amd]
# for cpu with integrated graphics
enabled="not is_wsl"
packages=[
    "amd-ucode",
    # "amdgpu_top-bin",
    "mesa",             # 3D hardware video acceleration
    "lib32-mesa",
    # "libva-utils",      # vainfo
    "mesa-utils",       # glxinfo
    "xf86-video-amdgpu" # xorg
]

[display.xorg]
# only enable when there is display manager
enabled="not is_wsl"
packages=[
    "xorg-server",
    "xorg-xdpyinfo",   # for =betterlockscreen=
    "xorg-xwininfo",   # Option for ~picom-trans~
    "dragon-drop",
    "mons"
]

[display.manager.sddm]
enabled=false
depends_on=["display-server"]
packages=[
    "sddm",
    "sddm-theme-corners-git",
    "sddm-sugar-light",
    # "sddm-sugar-candy-git"
]

[display.manager.lightdm]
enabled=false
depends_on=["display-server"]
packages=[
    "lightdm",
    "lightdm-webkit-theme-aether",
    "lightdm-webkit-theme-litarvan"
]

[display.manager.greetd]
enabled=false
depends_on=["display-server"]
packages=[
    "greetd-dms-greeter-git"
]

[display.gtk]
packages=[
    "gtk2", # pinenty
    "adw-gtk-theme",
    "python-pywal",
    "python-pywalfox-librewolf", # sync walfox theme
    "bibata-cursor-theme-bin",
    "papirus-icon-theme",
    "ttf-sarasa_ui-sc", # default font for gtk
]

[display.qt]
enabled="not is_wsl"
packages=[
    "kvantum",
    "kvantum-qt5", # qt5 style theme
    "kvantum-theme-orchis-git",
    "papirus-icon-theme",
    "qt5-styleplugins",
    "qt5-wayland",
    "qt5ct",
    "qt6ct", # for some qt6 applications
]

[desktop.sound]
enabled="not is_wsl"
packages=[
    "pipewire",
    "pipewire-alsa",
    "pipewire-jack",
    "pipewire-pulse",
    "wireplumber"
]

[desktop.bluetooth]
enabled="not is_wsl"
packages=["blueman", "bluez", "bluez-utils"]

[display.fontconfig]
packages=[
    "ttf-sarasa-gothic-sc",
    "adobe-source-code-pro-fonts",
    "noto-fonts-emoji" # emoji support
]

[desktop.inputmethod]
enabled="not is_wsl"
groups=["fcitx5-im"]
packages=[
    "fcitx5-nord",
    "fcitx5-rime",
    "rime-cloverpinyin",
    "rime-pinyin-zhwiki"
]

[applications.doom]
directory="~/.config/doom/"
packages=["emacs-pgtk-igc-git", "fd", "ripgrep"]

[development.shell]
directory="~/.config/fish/"
packages=[
    "fish",
    "wget",
    "bc",
    "tmux",
    "xcape",         # CapsLK as Esc in wsl
    "starship",      # shell prompt pretty
    "python-pipenv",
    "python-pipx",
    "direnv",
    "zoxide",
    "xorg-xdpyinfo", # set =GDK_SCALE= depends on resolution
    "fish-done"      # notify background shell work done
]

[applications.base]
enabled="not is_wsl"
packages=[
    "alacritty",
    "flameshot",
    "librewolf-bin",
    "peek",                      # screen recorder
    "nextcloud-client"
]

[hardware.usb]
enabled="not is_wsl"
packages=[
    "udiskie",             # automount usb drive
    "usbutils",            # =lsusb=
    "ventoy-bin",          # usb bootable media
]

[development.base]
packages=[
    "base-devel", # =gcc, which, make, sudo=
    "gcc",
    "gcc-fortran",
    "gdb",
    "python",
    "python-tomli", # required by this script
    "git",
    "openssh",
    "paru"
]

[tools.cli]
packages=[
    "bat",            # better =cat=
    "btop",           # system monitor
    "eza",            # better =ls=
    "zoxide",         # better =cd=
    "fzf",            # extend `zoxide' with selection
    "gdu-bin",        # =du= on all directories
    "man-db",         # man page
    "fastfetch",      # btw, ..
    "openbsd-netcat", # ssh using http tunnel using =nc=
    "7zip",
    "proxychains-ng", # force proxy
    "tmsu-bin",       # tag manager system
    "trash-cli",
    "unrar",
    "unzip",
    "yadm"            # reason you are here
]

[tools.pacman]
packages=[
    "expac",                  # query installed packages
    "pacfinder",
    "pacman-contrib",         # =checkupdates, paccache=
    "rebuild-detector",       # detect packages need to rebuild
]

[tools.private]
directory="~/.config/paru"
packages=["syncthing"]

[tools.remote]
enabled="not is_wsl"
packages=[
    "deskflow", # share keyboard
    "reframe",
    "remmina"
]

[desktop.amuse]
enabled="is_personal and not is_wsl"
packages=[
    "mpv",
    "qimgv", # image viewer
    "steam",
]

[applications.communicate]
enabled="is_personal and not is_wsl"
packages=[
    "wechat-universal-bwrap",
    # "wemeet-bin",
    "telegram-desktop"
]

[development.more]
enabled="not is_wsl"
packages=[
    "blender",
    "rsync",
    "git-filter-repo",
    "git-lfs",
    "docker",
    "docker-compose",
    # "genymotion", # android simulator
    "obs-studio",
    "ollama-cuda", # LLMs
    "gimp",
    "jdk-openjdk"
]

[hardware.devices]
enabled="is_personal and not is_wsl"
packages=[
    "openrgb-bin",
    "i2c-tools", # for =openrgb=
    "via-appimage"
]

[research.base]
enabled="not is_wsl and not is_laptop"
packages=[
    "jupyter-notebook",
    "mathematica",
    "miktex",
    "zotero-bin"
]

[system.windows]
enabled="is_personal and not is_wsl"
packages=[
    "ntfs-3g",   # mount ntfs partition
    "os-prober", # other os entries in grub
    "chntpw"     # dual boot bluetooth repair
]

[development.virtual]
enabled=false
# enabled="is_personal and not is_laptop and not is_wsl"
packages=[
    "dnsmasq",
    "edk2-ovmf",
    "genymotion", # android x86
    "libvirt",
    "qemu-desktop",
    "swtpm",
    "virt-manager",
    "virtio-win"
]

[system.monitor]
enabled=false
packages=[
    "cpupower-gui",
    "dmidecode",
    "hdparm",
    "smartmontools",
    "turbostat",
    "hwinfo"
]

[tools.benchmark]
enabled=false
packages=[
    "blender-benchmark",
    "unigine-heaven",
    "cpu-x",
    "crazydiskinfo",
    "kdiskmark",
    "nvme-cli",
    "s-tui"
]

[display.fontmanager]
enabled=false
# those are all my favorite fonts
packages=[
    "font-manager",
    # "fontforge", # build custom fonts
    # sans
    "ttc-iosevka-aile",
    "ttf-fira-sans",
    "ttf-opensans",
    "ttf-sarasa-gothic-sc",
    # serif
    "adobe-source-serif-fonts",
    "gentium-plus-font",
    # code
    "ttf-agave-nerd",
    "ttf-bqn386-git",
    "ttf-firacode-nerd",        # ligature
    "ttf-maple",
    "ttf-recursive",
    # ui
    "ttf-comic-shanns-v2",
    # emoji
    "ttf-material-design-icons-git",
    "noto-fonts-emoji",
    "quirvira",
    # chinese
    "ttf-arphic-ukai",
    "ttf-kose-git",
    "ttf-lxgw-wenkai",
    "ttf-yozai-font", # cute hand-write
    "ttf-lxgw-neo-xihei",
    "wqy-microhei"
]

[hardware.printer]
packages = ["cups", "hplip"]
